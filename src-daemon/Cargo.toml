[package]
name = "ralphd"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
dirs = "5"
futures-util = "0.3"
prompt-builder = { path = "../crates/prompt-builder" }
predefined-disciplines = { path = "../crates/predefined-disciplines" }
ralph-backend = { workspace = true }
ralph-contracts = { workspace = true }
ralph-errors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlite-db = { path = "../crates/sqlite-db" }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
