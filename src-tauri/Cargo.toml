[package]
name = "ralph4days"
version = "0.1.0"
description = "Ralph4days Desktop Application - Parallel task execution orchestration system"
authors = ["vince"]
edition = "2021"
rust-version = "1.75"
default-run = "ralph4days"

[lib]
name = "ralph4days_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-errors = { workspace = true }
core-contracts = { workspace = true }
tauri = { version = "2", default-features = false, features = ["wry", "dynamic-acl"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
russh = { version = "0.54.5", default-features = false, features = ["ring", "rsa"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "2"
security-framework-sys = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
service-runtime = { workspace = true }
service-project = { workspace = true }
service-tasks = { workspace = true }
service-subsystems = { workspace = true }
service-prompts = { workspace = true }
service-terminal = { workspace = true }
data-sqlite = { path = "../crates/data-sqlite" }
prompt-builder = { package = "ai-prompt-builder", path = "../crates/ai-prompt-builder" }
ai-external = { path = "../crates/ai-external" }
catalog-disciplines = { path = "../crates/catalog-disciplines" }
tauri-plugin-cli = "2"
serde_yaml = "0.9"
dirs = "5"
portable-pty = "0.9"
ts-rs = { workspace = true }
core-macros = { workspace = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", default-features = false, features = ["test"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Fast release builds for development testing
[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
strip = false
